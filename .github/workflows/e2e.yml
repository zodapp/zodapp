# Playwright E2E of apps (the DB samples apps/taskmanager and apps/survey, and apps/form-demo, which uses no DB).
# A workflow separate from the library CI (ci.yml); not a required check of branch protection.
# Each sample runs in its own job (they use the same ports, so they cannot run side by side on one machine).
name: E2E (samples)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/taskmanager/**
      - apps/survey/**
      - apps/form-demo/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/e2e.yml
  push:
    branches: [main]
    paths:
      - apps/taskmanager/**
      - apps/survey/**
      - apps/form-demo/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/e2e.yml

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [taskmanager, survey, form-demo]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      # Builds the dist of the packages (@zodapp/*) the samples use
      - run: pnpm exec turbo run build --filter='${{ matrix.app }}^...'
        working-directory: .

      # Chromium (the version follows @playwright/test)
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # DynamoDB Local and magnito (plus S3Proxy for taskmanager). infra/compose.yml. form-demo uses no DB
      - if: matrix.app != 'form-demo'
        run: pnpm infra:up
      # Playwright's webServer starts the app (for the DB samples, also the mail recorder, with AUTH_MAX_AGE_SECONDS=20)
      - run: pnpm e2e

      - if: failure() && matrix.app != 'form-demo'
        run: docker compose -f infra/compose.yml logs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.app }}
          path: |
            apps/${{ matrix.app }}/playwright-report/
            apps/${{ matrix.app }}/test-results/
          retention-days: 14
      - if: always() && matrix.app != 'form-demo'
        run: pnpm infra:down
