# Publishes the form demo (apps/form-demo) to GitHub Pages.
# It is served at https://<owner>.github.io/zodapp/, so it is built with base /zodapp/ (build:pages in package.json).
# In the repository's Settings → Pages, set Source to "GitHub Actions".
name: Pages (form demo)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter='form-demo^...'
      - run: pnpm --filter form-demo build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/form-demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
