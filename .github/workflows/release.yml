# Publishes @zodapp/* to npm (changesets).
#
# For now it only runs manually (workflow_dispatch). When publishing starts, add
#   push:
#     branches: [main]
# to the on below. See docs/releasing.md for the procedure.
#
# - If there are unreleased changesets, opens (or updates) the "Version Packages" PR
# - If there are no changesets and some versions are not on npm, publishes them with pnpm release
#
# npm authentication is trusted publishing (OIDC). NPM_TOKEN is not used.
# Register this file name (release.yml) as the npm trusted publisher.
name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # branch of the Version Packages PR, and tags
      pull-requests: write # the Version Packages PR
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      # Trusted publishing needs npm 11.5.1 or later (bundled with Node 24).
      # pnpm publish of pnpm 10 delegates the actual publishing to npm.
      # registry-url is not set (the token setting in .npmrc would get in the way of OIDC).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Check npm version
        run: |
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error("npm 11.5.1 or later is required"); process.exit(1) }' "$(npm --version)"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Version or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: "Version Packages"
          commit: "Version Packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
