# @zodapp/* を npm に公開する（changesets）。
#
# いまは手動（workflow_dispatch）でしか動かない。公開を始めるときに、下の on に
#   push:
#     branches: [main]
# を足す。手順は docs/releasing.md を参照。
#
# - 未公開の changeset があれば「Version Packages」の PR を作る（または更新する）
# - changeset がなく、npm にないバージョンがあれば pnpm release で公開する
#
# npm の認証は trusted publishing（OIDC）。NPM_TOKEN は使わない。
# npm の trusted publisher には、このファイル名（release.yml）で登録する。
name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Version Packages の PR のブランチとタグ
      pull-requests: write # Version Packages の PR
      id-token: write # npm の trusted publishing（OIDC）
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      # trusted publishing には npm 11.5.1 以上が要る（Node 24 に付いてくる）。
      # pnpm 10 の pnpm publish は、実際の公開を npm に任せる。
      # registry-url は付けない（.npmrc のトークン設定が OIDC の邪魔になるため）。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Check npm version
        run: |
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error("npm 11.5.1 以上が要る"); process.exit(1) }' "$(npm --version)"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Version or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: "Version Packages"
          commit: "Version Packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
